name: Sync to Hugging Face Hub

# Deploys the Lab (lab.py, Streamlit) to the Hugging Face Space on every push to main.
# Only the files the Space needs are pushed (as a fresh snapshot), so research
# results such as images and GIFs never reach the Space, which rejects binary
# files that are not stored with Git LFS. The Space installs requirements.txt, so
# the light research requirements are deployed under that name (no PyTorch).

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check the HF_TOKEN secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::The HF_TOKEN secret is missing. Create a Hugging Face access token with write permission, then add it in GitHub: Settings > Secrets and variables > Actions > New repository secret, named HF_TOKEN."
            exit 1
          fi

      - name: Build a deploy snapshot with the Lab files only
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hf-deploy
          git rm -r -q --cached .
          cp requirements-research.txt requirements.txt
          git add README.md lab.py research configs requirements.txt .gitattributes
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://ashyou09:$HF_TOKEN@huggingface.co/spaces/ashyou09/hybrid-rl-llm-explorer hf-deploy:main
